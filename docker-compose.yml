services:
  redis:
    image: redis:8-alpine@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  webscan:
    build:
      context: .
      target: web
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - "--port=8080"
      - "--dns=1.1.1.1"
      - "--timeout=5s"
      - "--redis-addr=redis:6379"
      - "--stale-timeout=30s"
      - "--max-concurrent-scans=1"
      - "--max-request-bytes=4096"
      - "--max-queue-size=1000"

volumes:
  redis-data:
