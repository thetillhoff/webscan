name: Build golang executable on push

on:
  push:
    branches:
      - renovate/**
  pull_request:

jobs:
  golang-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - linux
          - windows
          - darwin
        arch:
          - amd64
          - arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: thetillhoff/action-golang-build@b94bf8d46bc2dd0f7324fcbd0c6530838943976e # v1.1.0
        with:
          OS: "${{ matrix.os }}"
          ARCH: "${{ matrix.arch }}"
          BUILDARGS: -ldflags="-X main.version=${{ github.sha }}"

  verify-version:
    needs: golang-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          merge-multiple: true

      - name: Verify version
        shell: bash
        run: |
          # Make executable executable
          chmod +x ./webscan_linux_amd64

          # Check version using --version flag
          VERSION_OUTPUT=$(./webscan_linux_amd64 --version 2>&1 || echo "dev")
          VERSION_OUTPUT=$(echo "$VERSION_OUTPUT" | tr -d '\n\r' | xargs)  # Trim whitespace and newlines

          echo "Version output: '$VERSION_OUTPUT'"

          # Verify version matches the commit hash (for PRs and renovate branches)
          EXPECTED_VERSION="${{ github.sha }}"
          if [[ "$VERSION_OUTPUT" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Version mismatch! Expected: '$EXPECTED_VERSION', Got: '$VERSION_OUTPUT'"
            exit 1
          fi

          echo "✓ Version verification passed: $VERSION_OUTPUT"
