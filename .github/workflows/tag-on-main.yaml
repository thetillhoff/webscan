name: Automatically create patch releases when renovate merges a PR to main

on:
  push:
    branches:
      - main

# Two merges in quick succession would otherwise run in parallel, both read the
# same `git describe` tag, and compute the same next version - one tag push wins
# and the other fails. Serialize instead, and never cancel: a cancelled run
# leaves a tag whose release never happened.
concurrency:
  group: tag-on-main
  cancel-in-progress: false

jobs:
  determine-version:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'renovate[bot]' }}
    outputs:
      NEW_VERSION: ${{ steps.versions.outputs.NEW_VERSION }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: versions
        run: |
          CURRENT_VERSION=$(git describe --tags --abbrev=0)
          NEW_VERSION=v$(npx semver "$CURRENT_VERSION" -i patch)

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

  verify-build:
    needs: determine-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - linux
        arch:
          - amd64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: thetillhoff/action-golang-build@b94bf8d46bc2dd0f7324fcbd0c6530838943976e # v1.1.0
        with:
          OS: "${{ matrix.os }}"
          ARCH: "${{ matrix.arch }}"
          BUILDARGS: -ldflags="-X main.version=${{ needs.determine-version.outputs.NEW_VERSION }}"
          RELATIVE_PACKAGE_PATH: ./cmd/webscan/

      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          merge-multiple: true

      - name: Verify version
        shell: bash
        run: |
          chmod +x ./webscan_linux_amd64
          VERSION_OUTPUT=$(./webscan_linux_amd64 --version 2>&1 || echo "dev")
          VERSION_OUTPUT=$(echo "$VERSION_OUTPUT" | tr -d '\n\r' | xargs)
          EXPECTED_VERSION="${{ needs.determine-version.outputs.NEW_VERSION }}"
          if [[ "$VERSION_OUTPUT" != "$EXPECTED_VERSION" ]]; then
            echo "ERROR: Version mismatch! Expected: '$EXPECTED_VERSION', Got: '$VERSION_OUTPUT'"
            exit 1
          fi
          echo "✓ Version verification passed: $VERSION_OUTPUT"

  git-tag:
    needs:
      - determine-version
      - verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create tag
        run: |
          git tag "${{ needs.determine-version.outputs.NEW_VERSION }}"
          git push origin "${{ needs.determine-version.outputs.NEW_VERSION }}"

  # A tag pushed with GITHUB_TOKEN does not fire `on: push: tags:`, so the
  # release has to be called directly. Permissions are declared here because the
  # repository default is read-only and a called workflow cannot request more
  # than its caller was granted.
  trigger-release:
    needs:
      - determine-version
      - git-tag
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-golang-executable-on-tag.yaml
    # A called workflow receives no secrets unless they are passed. Without this
    # HOMEBREW_TAP_ACCESS_TOKEN is empty and the tap update fails after a
    # successful release - observed on temingo v3.0.5.
    secrets: inherit
    with:
      tag: ${{ needs.determine-version.outputs.NEW_VERSION }}
      # These releases get no CHANGELOG entry: the commit adding it could not
      # land on protected main, since a GITHUB_TOKEN commit gets no CI run and
      # so can never satisfy the required check. The body carries what the entry
      # would have said.
      release_body: "Updated dependencies."
